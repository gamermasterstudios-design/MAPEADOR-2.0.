name: Criar MAPEADOR 2.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: SDK do Android
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Preparação Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Criar projeto Android
        run: |
          mkdir -p app/src/main/java/com/mapeador/app
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MAPEADOR-2.0"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.mapeador.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.mapeador.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "2.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">MAPEADOR 2.0</string>
              <string name="accessibility_description">Serviço de mapeamento de teclas do MAPEADOR 2.0.</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.Mapeador" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:windowBackground">#0C0A13</item>
                  <item name="android:statusBarColor">#0C0A13</item>
                  <item name="android:navigationBarColor">#0C0A13</item>
                  <item name="colorPrimary">#A452FF</item>
                  <item name="colorPrimaryVariant">#6930C3</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_config.xml
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_description"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="50" />
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.Mapeador">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".MapService"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/mapeador/app/MainActivity.kt
          package com.mapeador.app

          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {

              private val roxo = Color.rgb(164, 82, 255)
              private val roxoEscuro = Color.rgb(105, 48, 195)
              private val fundo = Color.rgb(12, 10, 19)
              private val superficieCampo = Color.rgb(28, 22, 42)

              private val prefs: SharedPreferences by lazy {
                  getSharedPreferences("mapeador", Context.MODE_PRIVATE)
              }

              private lateinit var tecla: EditText
              private lateinit var x: EditText
              private lateinit var y: EditText
              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.decorView.setBackgroundColor(fundo)
                  window.statusBarColor = fundo
                  window.navigationBarColor = fundo
                  criarTela()
              }

              override fun onResume() {
                  super.onResume()
                  if (::status.isInitialized) {
                      atualizarEstadoServico()
                  }
              }

              private fun criarTela() {
                  val scroll = ScrollView(this).apply {
                      setBackgroundColor(fundo)
                      isFillViewport = true
                  }

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(24, 36, 24, 36)
                      setBackgroundColor(fundo)
                  }

                  val logo = TextView(this).apply {
                      text = "MAPEADOR 2.0"
                      textSize = 30f
                      gravity = Gravity.CENTER
                      setTextColor(roxo)
                      typeface = Typeface.DEFAULT_BOLD
                  }
                  layout.addView(logo)

                  val subtitulo = TextView(this).apply {
                      text = "2.0 • GAME MAPPING SYSTEM"
                      textSize = 12f
                      gravity = Gravity.CENTER
                      setTextColor(Color.LTGRAY)
                  }
                  layout.addView(subtitulo)
                  layout.addView(espaco(20))

                  status = TextView(this).apply {
                      textSize = 14f
                      gravity = Gravity.CENTER
                      typeface = Typeface.DEFAULT_BOLD
                  }
                  layout.addView(status)
                  atualizarEstadoServico()
                  layout.addView(espaco(20))

                  layout.addView(titulo("MAPEAMENTO DE TECLAS"))
                  tecla = campo("Ex: SPACE, W, A, S, D, R, E").apply {
                      setText(prefs.getString("map_key", "SPACE"))
                  }
                  layout.addView(tecla)
                  layout.addView(espaco(16))

                  layout.addView(titulo("POSIÇÃO DO TOQUE"))
                  x = campo("Coordenada X").apply {
                      setText(prefs.getInt("map_x", 500).toString())
                  }
                  layout.addView(x)
                  layout.addView(espaco(10))

                  y = campo("Coordenada Y").apply {
                      setText(prefs.getInt("map_y", 900).toString())
                  }
                  layout.addView(y)
                  layout.addView(espaco(20))

                  layout.addView(botao("SALVAR CONFIGURAÇÕES") {
                      salvar()
                  })
                  layout.addView(espaco(12))

                  layout.addView(botao("PERMITIR SOBREPOSIÇÃO (BOTÃO M)") {
                      pedirSobreposicao()
                  })
                  layout.addView(espaco(12))

                  layout.addView(botao("ATIVAR ACESSIBILIDADE") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  })
                  layout.addView(espaco(12))

                  layout.addView(botao("VERIFICAR SERVIÇO") {
                      atualizarEstadoServico()
                      Toast.makeText(this, status.text, Toast.LENGTH_SHORT).show()
                  })
                  layout.addView(espaco(24))

                  layout.addView(titulo("RECURSOS"))
                  val recursos = listOf(
                      "• Botão flutuante M com menu interativo",
                      "• Mapeamento de teclas e coordenadas X/Y",
                      "• Atalho F8 para ligar/desligar mapeamento",
                      "• Salvamento local das configurações"
                  )
                  recursos.forEach { item ->
                      val itemView = TextView(this).apply {
                          text = item
                          textSize = 14f
                          setTextColor(Color.LTGRAY)
                          setPadding(4, 6, 4, 6)
                      }
                      layout.addView(itemView)
                  }

                  scroll.addView(layout)
                  setContentView(scroll)
              }

              private fun atualizarEstadoServico() {
                  val ativo = MapService.isEnabled(this)
                  val sobreposicaoOk = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      Settings.canDrawOverlays(this)
                  } else {
                      true
                  }

                  status.text = if (ativo && sobreposicaoOk) {
                      "● SERVIÇO ATIVO • BOTÃO M PRONTO"
                  } else if (ativo) {
                      "● ACESSIBILIDADE ATIVA • ATIVE A SOBREPOSIÇÃO"
                  } else {
                      "○ SERVIÇO DESATIVADO"
                  }
                  status.setTextColor(if (ativo) Color.rgb(120, 255, 160) else Color.rgb(255, 120, 120))
              }

              private fun pedirSobreposicao() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                      val intent = Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")
                      )
                      startActivity(intent)
                  } else {
                      Toast.makeText(this, "Sobreposição já permitida!", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun salvar() {
                  val nome = tecla.text.toString().trim().uppercase()
                  val px = x.text.toString().trim().toIntOrNull()
                  val py = y.text.toString().trim().toIntOrNull()

                  if (nome.isEmpty() || px == null || py == null || px < 0 || py < 0) {
                      Toast.makeText(this, "Confira os campos de tecla e X/Y!", Toast.LENGTH_SHORT).show()
                      return
                  }

                  prefs.edit()
                      .putString("map_key", nome)
                      .putInt("map_x", px)
                      .putInt("map_y", py)
                      .apply()

                  Toast.makeText(this, "Configuração salva: $nome ($px, $py)", Toast.LENGTH_SHORT).show()
              }

              private fun campo(hintText: String): EditText {
                  return EditText(this).apply {
                      hint = hintText
                      setHintTextColor(Color.GRAY)
                      setTextColor(Color.WHITE)
                      textSize = 15f
                      setSingleLine(true)
                      setPadding(16, 14, 16, 14)
                      setBackgroundColor(superficieCampo)
                  }
              }

              private fun titulo(texto: String): TextView {
                  return TextView(this).apply {
                      text = texto
                      textSize = 14f
                      setTextColor(roxo)
                      typeface = Typeface.DEFAULT_BOLD
                      setPadding(0, 0, 0, 10)
                  }
              }

              private fun botao(texto: String, acao: () -> Unit): Button {
                  return Button(this).apply {
                      text = texto
                      setTextColor(Color.WHITE)
                      setBackgroundColor(roxoEscuro)
                      textSize = 13f
                      typeface = Typeface.DEFAULT_BOLD
                      setPadding(16, 18, 16, 18)
                      setOnClickListener { acao() }
                  }
              }

              private fun espaco(altura: Int): View {
                  return View(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          altura
                      )
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/mapeador/app/MapService.kt
          package com.mapeador.app

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Context
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.Typeface
