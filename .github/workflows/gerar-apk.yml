
name: Criar MAPEADOR 2.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Criar projeto Android
        run: |
          mkdir -p app/src/main/java/com/mapeador/app
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MAPEADOR-2.0"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.mapeador.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.mapeador.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "2.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">MAPEADOR 2.0</string>
              <string name="accessibility_description">Serviço de mapeamento de teclas.</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_description"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="false"
              android:notificationTimeout="50" />
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="MAPEADOR 2.0"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".MapService"
                      android:label="MAPEADOR 2.0"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config"/>

                  </service>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/mapeador/app/MainActivity.kt <<'EOF'
          package com.mapeador.app

          import android.app.Activity
          import android.os.Bundle
          import android.content.Context
          import android.content.Intent
          import android.provider.Settings
          import android.graphics.Color
          import android.graphics.Typeface
          import android.view.Gravity
          import android.view.View
          import android.widget.*

          class MainActivity : Activity() {

              private val roxo = Color.rgb(164, 82, 255)
              private val fundo = Color.rgb(12, 10, 19)

              private val prefs by lazy {
                  getSharedPreferences("mapeador", Context.MODE_PRIVATE)
              }

              private lateinit var tecla: EditText
              private lateinit var x: EditText
              private lateinit var y: EditText
              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  criarTela()
              }

              private fun criarTela() {
                  val scroll = ScrollView(this)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(24, 35, 24, 30)
                      setBackgroundColor(fundo)
                  }

                  val logo = TextView(this).apply {
                      text = "◈ MAPEADOR"
                      textSize = 30f
                      gravity = Gravity.CENTER
                      setTextColor(roxo)
                      typeface = Typeface.DEFAULT_BOLD
                  }

                  layout.addView(logo)

                  val subtitulo = TextView(this).apply {
                      text = "2.0 • GAME MAPPING SYSTEM"
                      gravity = Gravity.CENTER
                      setTextColor(Color.LTGRAY)
                      textSize = 12f
                  }

                  layout.addView(subtitulo)
                  layout.addView(espaco(25))

                  status = TextView(this).apply {
                      text = "● CONFIGURAÇÃO LOCAL"
                      setTextColor(roxo)
                      textSize = 15f
                  }

                  layout.addView(status)
                  layout.addView(titulo("MAPEAMENTO DE TECLAS"))

                  tecla = campo("Tecla: SPACE, W, A, S, D...")
                  tecla.setText(prefs.getString("map_key", "SPACE"))
                  layout.addView(tecla)

                  layout.addView(titulo("POSIÇÃO DO TOQUE"))

                  x = campo("Coordenada X")
                  x.setText(prefs.getInt("map_x", 500).toString())
                  layout.addView(x)

                  y = campo("Coordenada Y")
                  y.setText(prefs.getInt("map_y", 900).toString())
                  layout.addView(y)

                  layout.addView(espaco(15))

                  layout.addView(botao("SALVAR CONFIGURAÇÕES") {
                      salvar()
                  })

                  layout.addView(espaco(10))

                  layout.addView(botao("ATIVAR ACESSIBILIDADE") {
                      startActivity(
                          Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                      )
                  })

                  layout.addView(espaco(10))

                  layout.addView(botao("VERIFICAR SERVIÇO") {
                      val ativo = MapService.isEnabled(this)
                      status.text = if (ativo)
                          "● SERVIÇO ATIVADO"
                      else
                          "● SERVIÇO DESATIVADO"
                      status.setTextColor(
                          if (ativo) Color.GREEN else Color.YELLOW
                      )
                  })

                  layout.addView(espaco(25))
                  layout.addView(titulo("RECURSOS"))

                  val recursos = listOf(
                      "• Mapeamento de teclas",
                      "• Coordenadas personalizadas",
                      "• Botão flutuante",
                      "• Atalho F8",
                      "• Interface gamer",
                      "• Salvamento local"
                  )

                  recursos.forEach {
                      val item = TextView(this).apply {
                          text = it
                          textSize = 14f
                          setTextColor(Color.LTGRAY)
                          setPadding(5, 9, 5, 9)
                      }
                      layout.addView(item)
                  }

                  scroll.addView(layout)
                  setContentView(scroll)
              }

              private fun salvar() {
                  val nome = tecla.text.toString().trim().uppercase()
                  val px = x.text.toString().toIntOrNull()
                  val py = y.text.toString().toIntOrNull()

                  if (nome.isEmpty() || px == null || py == null ||
                      px < 0 || py < 0) {
                      Toast.makeText(
                          this,
                          "Confira os campos!",
                          Toast.LENGTH_SHORT
                      ).show()
                      return
                  }

                  prefs.edit()
                      .putString("map_key", nome)
                      .putInt("map_x", px)
                      .putInt("map_y", py)
                      .apply()

                  status.text = "● CONFIGURAÇÕES SALVAS"

                  Toast.makeText(
                      this,
                      "Salvo com sucesso!",
                      Toast.LENGTH_SHORT
                  ).show()
              }

              private fun campo(hintText: String): EditText {
                  return EditText(this).apply {
                      hint = hintText
                      setHintTextColor(Color.GRAY)
                      setTextColor(Color.WHITE)
                      textSize = 15f
                      setSingleLine(true)
                      setPadding(16, 12, 16, 12)
                      setBackgroundColor(Color.rgb(35, 29, 47))
                  }
              }

              private fun titulo(texto: String): TextView {
                  return TextView(this).apply {
                      text = texto
                      textSize = 14f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(roxo)
                      setPadding(0, 18, 0, 12)
                  }
              }

              private fun botao(
                  texto: String,
                  acao: () -> Unit
              ): Button {
                  return Button(this).apply {
                      text = texto
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.rgb(105, 48, 170))
                      textSize = 13f
                      setOnClickListener { acao() }
                  }
              }

              private fun espaco(altura: Int): View {
                  return View(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          1, altura
                      )
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/mapeador/app/MapService.kt <<'EOF'
          package com.mapeador.app

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.Color
          import android.content.Context
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.TextView
          import android.widget.Toast

          class MapService : AccessibilityService() {

              companion object {
                  fun isEnabled(context: Context): Boolean {
                      val manager = context.getSystemService(
                          Context.ACCESSIBILITY_SERVICE
                      ) as android.view.accessibility.AccessibilityManager

                      return manager.isEnabled
                  }
              }

              private var janela: WindowManager? = null
              private var botao: TextView? = null
              private var ativo = true

              private val prefs by lazy {
                  getSharedPreferences("mapeador", Context.MODE_PRIVATE)
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  janela = getSystemService(WINDOW_SERVICE) as WindowManager
                  mostrarBotao()
              }

              override fun onAccessibilityEvent(
                  event: AccessibilityEvent?
              ) {}

              override fun onInterrupt() {
                  removerBotao()
              }

              override fun onKeyEvent(event: KeyEvent): Boolean {
                  if (event.action != KeyEvent.ACTION_DOWN ||
                      event.repeatCount > 0) {
                      return false
                  }

                  if (event.keyCode == KeyEvent.KEYCODE_F8) {
                      ativo = !ativo
                      Toast.makeText(
                          this,
                          if (ativo) "MAPEADOR ATIVADO"
                          else "MAPEADOR DESATIVADO",
                          Toast.LENGTH_SHORT
                      ).show()
                      return true
                  }

                  if (!ativo) return false

                  val nome = prefs.getString("map_key", "SPACE") ?: "SPACE"
                  val codigo = codigoTecla(nome)

                  if (codigo != KeyEvent.KEYCODE_UNKNOWN &&
                      event.keyCode == codigo) {
                      tocar()
                      return true
                  }

                  return false
              }

              private fun codigoTecla(nome: String): Int {
                  return when (nome.uppercase()) {
                      "SPACE" -> KeyEvent.KEYCODE_SPACE
                      "W" -> KeyEvent.KEYCODE_W
                      "A" -> KeyEvent.KEYCODE_A
                      "S" -> KeyEvent.KEYCODE_S
                      "D" -> KeyEvent.KEYCODE_D
                      "E" -> KeyEvent.KEYCODE_E
                      "R" -> KeyEvent.KEYCODE_R
                      "F" -> KeyEvent.KEYCODE_F
                      "Q" -> KeyEvent.KEYCODE_Q
                      "G" -> KeyEvent.KEYCODE_G
                      "ENTER" -> KeyEvent.KEYCODE_ENTER
                      "TAB" -> KeyEvent.KEYCODE_TAB
                      else -> KeyEvent.KEYCODE_UNKNOWN
                  }
              }

              private fun tocar() {
                  val px = prefs.getInt("map_x", 500).toFloat()
                  val py = prefs.getInt("map_y", 900).toFloat()

                  val caminho = Path().apply {
                      moveTo(px, py)
                  }

                  val gesto = GestureDescription.Builder()
                      .addStroke(
                          GestureDescription.StrokeDescription(
                              caminho, 0, 70
                          )
                      )
                      .build()

                  dispatchGesture(gesto, null, null)
              }

              private fun mostrarBotao() {
                  if (botao != null) return

                  val view = TextView(this).apply {
                      text = "M"
                      textSize = 22f
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.rgb(112, 48, 190))
                  }

                  val parametros = WindowManager.LayoutParams(
                      58,
                      58,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 20
                      y = 250
                  }

                  view.setOnClickListener {
                      Toast.makeText(
                          this,
                          "MAPEADOR 2.0 • F8 liga/desliga",
                          Toast.LENGTH_SHORT
                      ).show()
                  }

                  view.setOnTouchListener { v, evento ->
                      when (evento.action) {
                          MotionEvent.ACTION_DOWN -> true
                          MotionEvent.ACTION_UP -> {
                              v.performClick()
                              true
                          }
                          else -> false
                      }
                  }

                  botao = view

                  try {
                      janela?.addView(view, parametros)
                  } catch (_: Exception) {
                      botao = null
                  }
              }

              private fun removerBotao() {
                  try {
                      botao?.let { janela?.removeView(it) }
                  } catch (_: Exception) {
                  }
                  botao = null
              }

              override fun onDestroy() {
                  removerBotao()
                  super.onDestroy()
              }
          }
          EOF

      - name: Gerar APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: MAPEADOR-2.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
