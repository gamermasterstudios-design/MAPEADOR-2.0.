          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import kotlin.math.abs

          class MapService : AccessibilityService() {

              companion object {
                  fun isEnabled(context: Context): Boolean {
                      val expected = "${context.packageName}/${MapService::class.java.name}"
                      val enabledServices = Settings.Secure.getString(
                          context.contentResolver,
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                      ) ?: return false
                      return enabledServices.split(":").any { it.equals(expected, ignoreCase = true) }
                  }
              }

              private val roxoNeon = Color.rgb(164, 82, 255)
              private val roxoBotao = Color.rgb(105, 48, 195)
              private val fundoEscuro = Color.rgb(12, 10, 19)
              private val mainHandler = Handler(Looper.getMainLooper())

              private val prefs: SharedPreferences by lazy {
                  getSharedPreferences("mapeador", Context.MODE_PRIVATE)
              }

              private var windowManager: WindowManager? = null
              private var floatView: Button? = null
              private var floatParams: WindowManager.LayoutParams? = null
              private var menuView: View? = null
              private var ativo = true
              private var statusMenuText: TextView? = null

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  mostrarBotao()
              }

              private fun podeDesenhar(): Boolean {
                  return windowManager != null && (
                      Build.VERSION.SDK_INT < Build.VERSION_CODES.M || Settings.canDrawOverlays(this)
                  )
              }

              private fun mostrarBotao() {
                  if (floatView != null || !podeDesenhar()) return

                  val params = WindowManager.LayoutParams(
                      120,
                      120,
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      else
                          WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 30
                      y = 260
                  }

                  val botao = Button(this).apply {
                      text = "M"
                      setTextColor(Color.WHITE)
                      setBackgroundColor(roxoNeon)
                      textSize = 18f
                      typeface = Typeface.DEFAULT_BOLD
                      setPadding(0, 0, 0, 0)
                  }

                  botao.setOnTouchListener(object : View.OnTouchListener {
                      private var startX = 0
                      private var startY = 0
                      private var touchX = 0f
                      private var touchY = 0f
                      private 
